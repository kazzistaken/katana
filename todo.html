<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASK-MASTER 3000</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --lcd: #9aa883;
      --lcd-dark: #8a9873;
      --ink: rgba(22, 30, 14, 0.88);
      --ghost: rgba(22, 30, 14, 0.07);
      --shadow: rgba(22, 30, 14, 0.18);
      --plastic: #2b2b2e;
    }
    body.light {
      --lcd: #6fd3c9;
      --lcd-dark: #5cc2b8;
      --ink: rgba(8, 36, 44, 0.9);
      --shadow: rgba(8, 36, 44, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 50% 30%, #4a4a50, #18181b 70%);
      font-family: "VT323", "Lucida Console", "Courier New", monospace;
    }

    /* the plastic case */
    .device {
      width: 100%;
      max-width: 460px;
      padding: 18px 20px 22px;
      background: linear-gradient(160deg, #3a3a3f, var(--plastic) 40%, #1f1f22);
      border-radius: 22px 22px 34px 34px;
      box-shadow: inset 0 2px 1px rgba(255,255,255,0.12), inset 0 -3px 6px rgba(0,0,0,0.5),
                  0 20px 40px rgba(0,0,0,0.6);
    }
    .brand {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 6px 10px;
      color: #c9c9cf;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .brand b { color: #e05a3a; font-style: italic; letter-spacing: 0.1em; font-size: 14px; }

    /* the screen */
    .bezel {
      padding: 10px;
      background: #111;
      border-radius: 10px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.9);
    }
    .lcd {
      position: relative;
      min-height: 380px;
      padding: 10px 12px 12px;
      color: var(--ink);
      background: linear-gradient(180deg, var(--lcd), var(--lcd-dark));
      border-radius: 4px;
      box-shadow: inset 0 0 18px rgba(0,0,0,0.35);
      text-shadow: 2px 2px 0 var(--shadow);
      text-transform: uppercase;
      font-size: 22px;
      line-height: 1;
      overflow: hidden;
      transition: background 0.2s;
    }
    body.light .lcd { box-shadow: inset 0 0 18px rgba(0,0,0,0.2), 0 0 24px rgba(111,211,201,0.5); }
    /* pixel grid */
    .lcd::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 3px);
    }

    .status { display: flex; justify-content: space-between; font-size: 16px; }
    .status .ind { opacity: 0.12; }
    .status .ind.on { opacity: 1; }

    .clock { position: relative; text-align: center; font-size: 64px; margin: 4px 0 2px; letter-spacing: 0.04em; }
    .clock .ghost { position: absolute; inset: 0; color: var(--ghost); text-shadow: none; }
    .sub { display: flex; justify-content: space-between; font-size: 18px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }

    form { display: flex; align-items: center; gap: 6px; margin: 8px 0 6px; }
    form label { font-size: 20px; }
    #new {
      flex: 1;
      min-width: 0;
      padding: 0;
      font: inherit;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow: inherit;
      caret-color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 2px dashed var(--ghost);
      outline: none;
    }
    #new::placeholder { color: var(--ghost); }

    ul { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow-y: auto; scrollbar-width: none; }
    ul::-webkit-scrollbar { display: none; }
    li { display: flex; align-items: center; gap: 8px; padding: 3px 2px; }
    li:hover, li:focus-within { background: var(--ink); color: var(--lcd); text-shadow: none; }
    li:hover button, li:focus-within button { color: var(--lcd); }
    li button {
      padding: 0;
      font: inherit;
      color: var(--ink);
      text-shadow: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }
    .text { flex: 1; word-break: break-word; cursor: text; }
    li.done .text { opacity: 0.4; text-decoration: line-through; }
    .del { opacity: 0; }
    li:hover .del, li:focus-within .del { opacity: 1; }
    .edit {
      flex: 1;
      min-width: 0;
      font: inherit;
      text-transform: uppercase;
      color: var(--lcd);
      background: transparent;
      border: none;
      outline: none;
      padding: 0;
    }
    .empty { justify-content: center; padding: 30px 0; animation: blink 1s steps(1) infinite; }
    .empty:hover { background: none; color: var(--ink); text-shadow: 2px 2px 0 var(--shadow); }
    @keyframes blink { 50% { opacity: 0; } }

    /* physical buttons */
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
    .btn { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .btn button {
      width: 46px; height: 22px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(#5a5a60, #38383c);
      box-shadow: 0 3px 0 #111, inset 0 1px 0 rgba(255,255,255,0.2);
      cursor: pointer;
    }
    .btn button:active { transform: translateY(2px); box-shadow: 0 1px 0 #111, inset 0 1px 0 rgba(255,255,255,0.2); }
    .btn.red button { background: linear-gradient(#e05a3a, #a8381f); }
    .btn span { color: #b8b8be; font: 10px "Arial Narrow", Arial, sans-serif; letter-spacing: 0.15em; }
  </style>
</head>
<body>
  <div class="device">
    <div class="brand"><b>TASK-MASTER 3000</b><span>Water resist · Alarm chrono</span></div>
    <div class="bezel">
      <div class="lcd">
        <div class="status">
          <span id="ind-all" class="ind">ALL</span>
          <span id="ind-active" class="ind">ACT</span>
          <span id="ind-done" class="ind">DONE</span>
          <span id="ind-snd" class="ind on">♪</span>
          <span id="day"></span>
        </div>
        <div class="clock"><span class="ghost">88:88:88</span><span id="time">00:00:00</span></div>
        <div class="sub"><span id="date"></span><span id="count"></span></div>

        <form id="form" autocomplete="off">
          <label for="new">&gt;</label>
          <input id="new" placeholder="NEW TASK_" maxlength="40" autofocus>
        </form>

        <ul id="list"></ul>
      </div>
    </div>

    <div class="buttons">
      <div class="btn"><button id="b-mode" aria-label="Mode: change filter"></button><span>MODE</span></div>
      <div class="btn"><button id="b-light" aria-label="Toggle backlight"></button><span>LIGHT</span></div>
      <div class="btn"><button id="b-snd" aria-label="Toggle sound"></button><span>SOUND</span></div>
      <div class="btn red"><button id="clear" aria-label="Clear done tasks"></button><span>CLR DONE</span></div>
    </div>
  </div>

  <script>
    const KEY = 'tasks-app-v1';
    const $ = (id) => document.getElementById(id);
    const FILTERS = ['all', 'active', 'done'];

    let tasks = load();
    let filter = 'all';
    let sound = true;
    let audio;

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch { return []; }
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {}
    }

    // the classic digital-watch beep
    function beep(freq = 2400, ms = 60) {
      if (!sound) return;
      try {
        audio = audio || new AudioContext();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.value = 0.04;
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + ms / 1000);
      } catch {}
    }

    const pad = (n) => String(n).padStart(2, '0');

    function render() {
      const list = $('list');
      list.replaceChildren();

      const shown = tasks.filter((t) =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done);

      if (shown.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = tasks.length === 0 ? '-- NO DATA --' : filter === 'done' ? '-- NONE DONE --' : '-- ALL CLEAR --';
        list.append(li);
      }

      for (const t of shown) {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');

        const box = document.createElement('button');
        box.textContent = t.done ? '[■]' : '[ ]';
        box.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
        box.addEventListener('click', () => { t.done = !t.done; beep(t.done ? 3000 : 1800); save(); render(); });

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = t.text;
        text.addEventListener('dblclick', () => startEdit(text, t));

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = 'DEL';
        del.setAttribute('aria-label', 'Delete task');
        del.addEventListener('click', () => {
          tasks = tasks.filter((x) => x.id !== t.id);
          beep(900, 120); save(); render();
        });

        li.append(box, text, del);
        list.append(li);
      }

      const left = tasks.filter((t) => !t.done).length;
      $('count').textContent = `LEFT ${pad(left)}`;
      for (const f of FILTERS) $('ind-' + f).classList.toggle('on', f === filter);
    }

    function startEdit(textEl, task) {
      const input = document.createElement('input');
      input.className = 'edit';
      input.value = task.text;
      input.maxLength = 40;
      textEl.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;
      const finish = (commit) => {
        if (finished) return;
        finished = true;
        const value = input.value.trim();
        if (commit) {
          if (value) task.text = value;
          else tasks = tasks.filter((x) => x.id !== task.id);
          save();
          beep();
        }
        render();
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') finish(true);
        if (e.key === 'Escape') finish(false);
      });
      input.addEventListener('blur', () => finish(true));
    }

    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('new');
      const text = input.value.trim();
      if (!text) { beep(600, 200); return; }
      tasks.unshift({ id: Date.now() + Math.random(), text, done: false });
      input.value = '';
      if (filter === 'done') filter = 'all';
      beep(); save(); render();
    });

    $('b-mode').addEventListener('click', () => {
      filter = FILTERS[(FILTERS.indexOf(filter) + 1) % FILTERS.length];
      beep(); render();
    });
    $('b-light').addEventListener('click', () => { document.body.classList.toggle('light'); beep(); });
    $('b-snd').addEventListener('click', () => {
      sound = !sound;
      $('ind-snd').classList.toggle('on', sound);
      beep();
    });
    $('clear').addEventListener('click', () => {
      tasks = tasks.filter((t) => !t.done);
      beep(1200, 150); save(); render();
    });

    function tick() {
      const d = new Date();
      $('time').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      $('day').textContent = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][d.getDay()];
      $('date').textContent = `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    tick();
    setInterval(tick, 1000);
    render();
  </script>
</body>
</html>

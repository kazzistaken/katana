<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
      background: #f6f6f4;
      color: #222;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #22a355;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #1b8545; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    .muted { color: #777; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Test Page</h1>
    <p class="muted">Loaded at <span id="loaded"></span></p>
    <p>JavaScript: <strong id="js-status">not running</strong></p>
  </div>

  <div class="card">
    <p>Clicks: <strong id="count">0</strong></p>
    <button id="btn">Click me</button>
  </div>

  <div class="card">
    <input id="input" placeholder="Type something...">
    <p>Echo: <span id="echo"></span></p>
  </div>

  <script>
    document.getElementById('js-status').textContent = 'running ✓';
    document.getElementById('loaded').textContent = new Date().toLocaleString();

    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('count').textContent = ++count;
    });

    document.getElementById('input').addEventListener('input', (e) => {
      document.getElementById('echo').textContent = e.target.value;
    });
  </script>
</body>
</html>
